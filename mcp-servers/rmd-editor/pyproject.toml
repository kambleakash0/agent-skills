[project]
name = "rmd-editor-mcp"
version = "1.2.0"
description = "MCP Server for editing R Markdown (.rmd) documents with chunk-level operations and R kernel execution"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "pyyaml>=6.0",
    "jupyter-client>=8.6.0",
    "pydantic>=2.12.0",
]
authors = [{ name = "Akash Kamble", email = "kambleakash0@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
rmd-editor-mcp = "rmd_editor.server:main"

[tool.hatch.build.targets.wheel]
packages = ["rmd_editor"]

[tool.uv]
exclude-newer = "7 days"

[project.urls]
Homepage = "https://github.com/kambleakash0/agent-skills/tree/main/mcp-servers"
Repository = "https://github.com/kambleakash0/agent-skills"
Issues = "https://github.com/kambleakash0/agent-skills/issues"
